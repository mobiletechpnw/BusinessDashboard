<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<script src="util.js"></script>
<script src="shared.js" defer></script>
<script src="supabase-sync.js" defer></script>
<title>Goals & Objectives Dashboard</title>
<style>
  body { min-height: 100vh; }

  header {
    background: rgba(13, 15, 22, 0.72);
    backdrop-filter: blur(20px) saturate(1.3);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    min-height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 200;
  }
  header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.3px; }
  header h1 span { color: var(--accent); }
  .header-stats { display: flex; gap: 20px; align-items: center; }
  .stat { text-align: center; display: flex; align-items: baseline; gap: 6px; }
  .stat-num { font-size: 1.1rem; font-weight: 800; color: var(--accent); }
  .stat-label { font-size: 0.66rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }

  main { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .top-bar-left { display: flex; gap: 8px; align-items: center; }

  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 9px 16px;
    transition: all 0.15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #7d9bff; }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-icon { padding: 6px 10px; font-size: 1rem; }

  .filter-group { display: flex; gap: 6px; }
  .filter-btn { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); padding: 7px 14px; font-size: 0.78rem; }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .goals-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr));
    gap: 20px;
  }

  .goal-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .goal-card:hover { border-color: var(--accent); }
  .goal-card.completed { opacity: 0.6; }

  .goal-header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .goal-title-row { display: flex; align-items: flex-start; gap: 10px; }
  .goal-check {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--border);
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .goal-check.done { background: var(--green); border-color: var(--green); }
  .goal-check.done::after { content: '✓'; color: #000; font-size: 11px; font-weight: 700; }
  .goal-title {
    font-size: 1rem; font-weight: 700; flex: 1; line-height: 1.35;
    cursor: pointer;
  }
  .goal-title.done { text-decoration: line-through; color: var(--text2); }
  .goal-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
  .goal-card:hover .goal-actions { opacity: 1; }
  .icon-btn {
    background: none; border: none; color: var(--text2); padding: 4px 6px;
    font-size: 0.85rem; border-radius: 5px; cursor: pointer;
  }
  .icon-btn:hover { background: var(--surface2); color: var(--text); }

  .goal-meta { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .badge {
    font-size: 0.68rem; font-weight: 700; padding: 2px 8px;
    border-radius: 99px; text-transform: uppercase; letter-spacing: 0.4px;
  }
  .badge-high { background: #3b1212; color: var(--red); }
  .badge-medium { background: #3b2e12; color: var(--yellow); }
  .badge-low { background: #123b20; color: var(--green); }
  .badge-none { background: var(--surface2); color: var(--text2); }
  .due-date { font-size: 0.72rem; color: var(--text2); }
  .due-date.overdue { color: var(--red); }
  .due-date.soon { color: var(--yellow); }

  .progress-bar-wrap { margin-top: 10px; }
  .progress-bar-bg { background: var(--surface2); border-radius: 99px; height: 5px; overflow: hidden; }
  .progress-bar-fill { height: 100%; border-radius: 99px; background: var(--accent); transition: width 0.3s; }
  .progress-label { font-size: 0.68rem; color: var(--text2); margin-top: 4px; }

  .obj-list { padding: 10px 18px 14px; }
  .obj-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid #1e2138;
  }
  .obj-item:last-child { border-bottom: none; }
  .obj-check {
    width: 16px; height: 16px; border-radius: 4px;
    border: 2px solid var(--border);
    cursor: pointer; flex-shrink: 0; margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .obj-check.done { background: var(--accent); border-color: var(--accent); }
  .obj-check.done::after { content: '✓'; color: #fff; font-size: 9px; font-weight: 700; }
  .obj-text { font-size: 0.85rem; flex: 1; line-height: 1.4; }
  .obj-text.done { text-decoration: line-through; color: var(--text2); }
  .obj-actions { display: flex; gap: 2px; opacity: 0; transition: opacity 0.12s; }
  .obj-item:hover .obj-actions { opacity: 1; }
  .obj-due { font-size: 0.68rem; color: var(--text2); white-space: nowrap; }
  .obj-due.overdue { color: var(--red); }
  .obj-priority { font-size: 0.6rem; font-weight: 700; padding: 1px 6px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.3px; flex-shrink: 0; }
  .obj-priority-high   { background: #3b1212; color: var(--red); }
  .obj-priority-medium { background: #3b2e12; color: var(--yellow); }
  .obj-priority-low    { background: #123b20; color: var(--green); }

  /* Drag & drop */
  .goal-card.drag-over { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(108,140,255,0.25); }
  .goal-card[draggable] { cursor: grab; }
  .goal-card[draggable]:active { cursor: grabbing; }
  .drag-handle { color: var(--text2); font-size: 0.8rem; cursor: grab; padding: 2px 4px; border-radius: 3px; opacity: 0; transition: opacity 0.12s; flex-shrink: 0; }
  .goal-card:hover .drag-handle { opacity: 1; }
  .obj-item.drag-over { border-top: 2px solid var(--accent); }

  .add-obj-row { padding: 0 18px 14px; }
  .add-obj-input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 7px; color: var(--text); padding: 8px 12px; font-size: 0.82rem;
    outline: none; transition: border-color 0.15s;
  }
  .add-obj-input:focus { border-color: var(--accent); }
  .add-obj-input::placeholder { color: var(--text2); }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); z-index: 200;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 28px; width: 480px; max-width: 95vw;
  }
  .modal h2 { font-size: 1.1rem; margin-bottom: 20px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 0.78rem; color: var(--text2); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
  .field input, .field textarea, .field select {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 0.88rem;
    outline: none; font-family: inherit; transition: border-color 0.15s;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
  .field select option { background: var(--surface); }
  .field textarea { resize: vertical; min-height: 70px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }

  /* Empty state */
  .empty {
    grid-column: 1/-1; text-align: center;
    padding: 60px 20px; color: var(--text2);
  }
  .empty .icon { font-size: 3rem; margin-bottom: 14px; }
  .empty h3 { font-size: 1.1rem; color: var(--text); margin-bottom: 8px; }
  .empty p { font-size: 0.85rem; }

  /* Obj edit modal */
  #objModal .modal { width: 440px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--surface); border: 1px solid var(--accent);
    color: var(--text); padding: 12px 20px; border-radius: 9px;
    font-size: 0.85rem; z-index: 300;
    transform: translateY(80px); opacity: 0;
    transition: all 0.25s;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* Sort dropdown */
  .sort-select {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 7px 12px;
    font-size: 0.78rem; cursor: pointer; outline: none;
  }

  @media (max-width: 700px) {
    main { padding: 12px 10px; }
    header { padding: 0 12px; min-height: 52px; }
    header h1 { font-size: 1.05rem; }
    .header-stats { gap: 8px; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
    .header-stats::-webkit-scrollbar { display: none; }
    .stat-num { font-size: 1.1rem; }
    .stat-label { font-size: 0.6rem; }
    .top-bar { flex-direction: column; align-items: stretch; }
    .top-bar-left { flex-wrap: wrap; }
    .filter-group { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
    .filter-group::-webkit-scrollbar { display: none; }
    .filter-btn { white-space: nowrap; flex-shrink: 0; min-height: 40px; }
    .sort-select { width: 100%; }
    /* Add goal button: hide from top-bar (FAB takes over) */
    .top-bar > .btn-primary { display: none; }
  }
  @media (max-width: 480px) {
    .modal { border-radius: 16px 16px 0 0; }
  }
</style>
</head>
<body>

<header>
  <h1>Goals <span>&</span> Objectives</h1>
  <div class="header-stats">
    <a href="index.html" style="font-size:0.72rem;color:var(--text2);text-decoration:none;padding:5px 12px;border:1px solid var(--border);border-radius:6px;transition:all 0.15s;white-space:nowrap;align-self:center;" onmouseover="this.style.color='var(--accent)';this.style.borderColor='var(--accent)'" onmouseout="this.style.color='var(--text2)';this.style.borderColor='var(--border)'">⌂ Home</a>
    <div class="stat"><div class="stat-num" id="statGoals">0</div><div class="stat-label">Goals</div></div>
    <div class="stat"><div class="stat-num" id="statObj">0</div><div class="stat-label">Objectives</div></div>
    <div class="stat"><div class="stat-num" id="statDone">0</div><div class="stat-label">Complete</div></div>
    <div class="stat"><div class="stat-num" id="statPct">0%</div><div class="stat-label">Progress</div></div>
  </div>
</header>

<nav class="dash-nav">
  <a href="index.html" class="dash-nav-link">⌂ Home</a>
  <a href="vault-pine-collective.html" class="dash-nav-link">📊 Sales Hub</a>
  <a href="goals-dashboard.html" class="dash-nav-link active">🎯 Goals</a>
  <a href="expenses.html" class="dash-nav-link">💸 Expenses</a>
  <a href="analytics.html" class="dash-nav-link">📈 Analytics</a>
  <a href="production.html" class="dash-nav-link">🖨️ Production</a>
  <a href="events.html" class="dash-nav-link">🎪 Events</a>
  <a href="content.html" class="dash-nav-link">📱 Content</a>
  <a href="growth.html" class="dash-nav-link">🚀 Growth</a>
  <a href="review.html" class="dash-nav-link">📋 Review</a>
  <a href="guru.html" class="dash-nav-link">🥋 Guru</a>
</nav>

<main>
  <div class="top-bar">
    <div class="top-bar-left">
      <div class="filter-group" id="filterGroup">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
        <button class="filter-btn" data-filter="high">High Priority</button>
      </div>
      <select class="sort-select" id="sortSelect">
        <option value="created">Sort: Date Created</option>
        <option value="priority">Sort: Priority</option>
        <option value="due">Sort: Due Date</option>
        <option value="progress">Sort: Progress</option>
        <option value="title">Sort: Title</option>
      </select>
    </div>
    <button class="btn-primary" onclick="openGoalModal()">+ Add Goal</button>
  </div>

  <div class="goals-grid" id="goalsGrid"></div>
</main>

<!-- Goal Modal -->
<div class="modal-overlay" id="goalModal">
  <div class="modal">
    <h2 id="goalModalTitle">New Goal</h2>
    <div class="field">
      <label>Goal Title</label>
      <input type="text" id="gTitle" placeholder="e.g. Launch personal portfolio site" />
    </div>
    <div class="field">
      <label>Description (optional)</label>
      <textarea id="gDesc" placeholder="What does success look like?"></textarea>
    </div>
    <div class="field">
      <label>Priority</label>
      <select id="gPriority">
        <option value="none">None</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
    </div>
    <div class="field">
      <label>Target Date (optional)</label>
      <input type="date" id="gDue" />
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeGoalModal()">Cancel</button>
      <button class="btn-primary" onclick="saveGoal()">Save Goal</button>
    </div>
  </div>
</div>

<!-- Objective Modal -->
<div class="modal-overlay" id="objModal">
  <div class="modal">
    <h2 id="objModalTitle">Add Objective</h2>
    <div class="field">
      <label>Objective</label>
      <input type="text" id="oText" placeholder="e.g. Write 3 case studies" />
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="field">
        <label>Due Date (optional)</label>
        <input type="date" id="oDue" />
      </div>
      <div class="field">
        <label>Priority</label>
        <select id="oPriority">
          <option value="">None</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeObjModal()">Cancel</button>
      <button class="btn-primary" onclick="saveObj()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<button class="fab" onclick="openGoalModal()" title="Add Goal" aria-label="Add Goal">＋</button>

<script>
// ── Data ────────────────────────────────────────────────────────────
const KEY = 'goals_dashboard_v1';
let data = { goals: [] };
let filter = 'all';
let sort = 'created';
let editGoalId = null;
let editObjId = null;
let editObjGoalId = null;

function load() {
  try { data = JSON.parse(localStorage.getItem(KEY)) || { goals: [] }; } catch { data = { goals: [] }; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(data)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

// ── Render ───────────────────────────────────────────────────────────
function render() {
  const grid = document.getElementById('goalsGrid');
  let goals = [...data.goals];

  // filter
  if (filter === 'active') goals = goals.filter(g => !g.done);
  else if (filter === 'completed') goals = goals.filter(g => g.done);
  else if (filter === 'high') goals = goals.filter(g => g.priority === 'high');

  // sort
  const pOrder = { high: 3, medium: 2, low: 1, none: 0 };
  goals.sort((a, b) => {
    if (sort === 'priority') return (pOrder[b.priority] || 0) - (pOrder[a.priority] || 0);
    if (sort === 'due') {
      if (!a.due && !b.due) return 0;
      if (!a.due) return 1;
      if (!b.due) return -1;
      return a.due.localeCompare(b.due);
    }
    if (sort === 'progress') return objProgress(b) - objProgress(a);
    if (sort === 'title') return a.title.localeCompare(b.title);
    return b.createdAt - a.createdAt;
  });

  if (!goals.length) {
    grid.innerHTML = `<div class="empty"><div class="icon">🎯</div><h3>No goals yet</h3><p>Add your first goal to get started.</p></div>`;
  } else {
    grid.innerHTML = goals.map(goalHTML).join('');
  }
  updateStats();
}

function objProgress(g) {
  if (!g.objectives || !g.objectives.length) return 0;
  return g.objectives.filter(o => o.done).length / g.objectives.length;
}

function goalHTML(g) {
  const objs = g.objectives || [];
  const done = objs.filter(o => o.done).length;
  const pct = objs.length ? Math.round(done / objs.length * 100) : 0;
  const dueStr = dueDateStr(g.due);
  const dueClass = dueDateClass(g.due);

  return `<div class="goal-card ${g.done ? 'completed' : ''}" id="goal-${g.id}" draggable="true"
    ondragstart="dragGoalStart(event,'${g.id}')" ondragover="dragGoalOver(event)" ondrop="dragGoalDrop(event,'${g.id}')" ondragleave="dragGoalLeave(event)" ondragend="dragGoalEnd()">
    <div class="goal-header">
      <div class="goal-title-row">
        <span class="drag-handle" title="Drag to reorder">⠿</span>
        <div class="goal-check ${g.done ? 'done' : ''}" onclick="toggleGoal('${g.id}')"></div>
        <div class="goal-title ${g.done ? 'done' : ''}" onclick="toggleGoal('${g.id}')">${esc(g.title)}</div>
        <div class="goal-actions">
          <button class="icon-btn" title="Add objective" onclick="openObjModal('${g.id}')">＋</button>
          <button class="icon-btn" title="Edit goal" onclick="openGoalModal('${g.id}')">✏️</button>
          <button class="icon-btn" title="Delete goal" onclick="deleteGoal('${g.id}')">🗑</button>
        </div>
      </div>
      ${g.desc ? `<div style="font-size:0.78rem;color:var(--text2);margin-top:6px;margin-left:30px">${esc(g.desc)}</div>` : ''}
      <div class="goal-meta" style="margin-left:30px">
        <span class="badge badge-${g.priority || 'none'}">${g.priority || 'no priority'}</span>
        ${g.due ? `<span class="due-date ${dueClass}">📅 ${dueStr}</span>` : ''}
        ${objs.length ? `<span style="font-size:0.72rem;color:var(--text2)">${done}/${objs.length} done</span>` : ''}
      </div>
      ${objs.length ? `<div class="progress-bar-wrap" style="margin-left:30px">
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      </div>` : ''}
    </div>
    <div class="obj-list">
      ${objs.map(o => objHTML(g.id, o)).join('')}
    </div>
    <div class="add-obj-row">
      <input class="add-obj-input" placeholder="+ Add objective, press Enter…"
        onkeydown="quickAddObj(event,'${g.id}')" />
    </div>
  </div>`;
}

function objHTML(gid, o) {
  const dueClass = dueDateClass(o.due);
  const pri = o.priority;
  return `<div class="obj-item" id="obj-${o.id}" draggable="true"
    ondragstart="dragObjStart(event,'${gid}','${o.id}')" ondragover="dragObjOver(event)" ondrop="dragObjDrop(event,'${gid}','${o.id}')" ondragleave="dragObjLeave(event)" ondragend="dragObjEnd()">
    <div class="obj-check ${o.done ? 'done' : ''}" onclick="toggleObj('${gid}','${o.id}')"></div>
    <div class="obj-text ${o.done ? 'done' : ''}">${esc(o.text)}</div>
    ${pri ? `<span class="obj-priority obj-priority-${pri}">${pri}</span>` : ''}
    ${o.due ? `<span class="obj-due ${dueClass}">${fmtDate(o.due)}</span>` : ''}
    <div class="obj-actions">
      <button class="icon-btn btn-icon" title="Edit" onclick="openObjModal('${gid}','${o.id}')">✏️</button>
      <button class="icon-btn btn-icon" title="Delete" onclick="deleteObj('${gid}','${o.id}')">✕</button>
    </div>
  </div>`;
}

// ── Stats ─────────────────────────────────────────────────────────────
function updateStats() {
  const goals = data.goals;
  const allObj = goals.flatMap(g => g.objectives || []);
  const doneObj = allObj.filter(o => o.done);
  const pct = allObj.length ? Math.round(doneObj.length / allObj.length * 100) : 0;
  document.getElementById('statGoals').textContent = goals.length;
  document.getElementById('statObj').textContent = allObj.length;
  document.getElementById('statDone').textContent = doneObj.length;
  document.getElementById('statPct').textContent = pct + '%';
}

// ── Date helpers ──────────────────────────────────────────────────────
function fmtDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-');
  return `${m}/${day}/${y.slice(2)}`;
}
function dueDateStr(d) {
  if (!d) return '';
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(d + 'T00:00:00');
  const diff = Math.round((due - today) / 86400000);
  if (diff < 0) return `Overdue by ${-diff}d`;
  if (diff === 0) return 'Due today';
  if (diff <= 7) return `Due in ${diff}d`;
  return fmtDate(d);
}
function dueDateClass(d) {
  if (!d) return '';
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(d + 'T00:00:00');
  const diff = Math.round((due - today) / 86400000);
  if (diff < 0) return 'overdue';
  if (diff <= 3) return 'soon';
  return '';
}
function esc(s) {
  // Core &<> escaping shared via util.js; keep the quote-escaping this page relied on.
  return VPCUtil.esc(s || '').replace(/"/g,'&quot;');
}

// ── Goal CRUD ─────────────────────────────────────────────────────────
function openGoalModal(id) {
  editGoalId = id || null;
  const m = document.getElementById('goalModal');
  document.getElementById('goalModalTitle').textContent = id ? 'Edit Goal' : 'New Goal';
  if (id) {
    const g = data.goals.find(x => x.id === id);
    document.getElementById('gTitle').value = g.title;
    document.getElementById('gDesc').value = g.desc || '';
    document.getElementById('gPriority').value = g.priority || 'none';
    document.getElementById('gDue').value = g.due || '';
  } else {
    document.getElementById('gTitle').value = '';
    document.getElementById('gDesc').value = '';
    document.getElementById('gPriority').value = 'none';
    document.getElementById('gDue').value = '';
  }
  m.classList.add('open');
  setTimeout(() => document.getElementById('gTitle').focus(), 50);
}
function closeGoalModal() { document.getElementById('goalModal').classList.remove('open'); }

function saveGoal() {
  const title = document.getElementById('gTitle').value.trim();
  if (!title) { toast('Please enter a goal title.'); return; }
  if (editGoalId) {
    const g = data.goals.find(x => x.id === editGoalId);
    g.title = title;
    g.desc = document.getElementById('gDesc').value.trim();
    g.priority = document.getElementById('gPriority').value;
    g.due = document.getElementById('gDue').value || null;
  } else {
    data.goals.push({
      id: uid(), title,
      desc: document.getElementById('gDesc').value.trim(),
      priority: document.getElementById('gPriority').value,
      due: document.getElementById('gDue').value || null,
      done: false,
      createdAt: Date.now(),
      objectives: []
    });
  }
  save();
  if (typeof auditLog === 'function') auditLog(editGoalId ? 'EDIT_GOAL' : 'ADD_GOAL', 'goals_dashboard_v1', document.getElementById('gTitle')?.value || '');
  closeGoalModal(); render();
  toast(editGoalId ? 'Goal updated.' : 'Goal added!');
}

function toggleGoal(id) {
  const g = data.goals.find(x => x.id === id);
  g.done = !g.done;
  save(); render();
}

function deleteGoal(id) {
  if (!confirm('Delete this goal and all its objectives?')) return;
  data.goals = data.goals.filter(x => x.id !== id);
  save();
  if (typeof auditLog === 'function') auditLog('DELETE_GOAL', 'goals_dashboard_v1', `Goal deleted`);
  render(); toast('Goal deleted.');
}

// ── Objective CRUD ────────────────────────────────────────────────────
function openObjModal(gid, oid) {
  editObjGoalId = gid;
  editObjId = oid || null;
  document.getElementById('objModalTitle').textContent = oid ? 'Edit Objective' : 'Add Objective';
  if (oid) {
    const g = data.goals.find(x => x.id === gid);
    const o = g.objectives.find(x => x.id === oid);
    document.getElementById('oText').value = o.text;
    document.getElementById('oDue').value = o.due || '';
    document.getElementById('oPriority').value = o.priority || '';
  } else {
    document.getElementById('oText').value = '';
    document.getElementById('oDue').value = '';
    document.getElementById('oPriority').value = '';
  }
  document.getElementById('objModal').classList.add('open');
  setTimeout(() => document.getElementById('oText').focus(), 50);
}
function closeObjModal() { document.getElementById('objModal').classList.remove('open'); }

function saveObj() {
  const text = document.getElementById('oText').value.trim();
  if (!text) { toast('Please enter an objective.'); return; }
  const g = data.goals.find(x => x.id === editObjGoalId);
  const priority = document.getElementById('oPriority').value || null;
  if (editObjId) {
    const o = g.objectives.find(x => x.id === editObjId);
    o.text = text;
    o.due = document.getElementById('oDue').value || null;
    o.priority = priority;
  } else {
    g.objectives.push({ id: uid(), text, due: document.getElementById('oDue').value || null, priority, done: false });
  }
  save();
  if (typeof auditLog === 'function') auditLog('SAVE_OBJECTIVE', 'goals_dashboard_v1', document.getElementById('oText')?.value || '');
  closeObjModal(); render(); toast(editObjId ? 'Objective updated.' : 'Objective added!');
}

function quickAddObj(e, gid) {
  if (e.key !== 'Enter') return;
  const text = e.target.value.trim();
  if (!text) return;
  const g = data.goals.find(x => x.id === gid);
  g.objectives.push({ id: uid(), text, due: null, done: false });
  save(); render();
  // re-focus the same card's input
  const inp = document.querySelector(`#goal-${gid} .add-obj-input`);
  if (inp) inp.focus();
}

function toggleObj(gid, oid) {
  const g = data.goals.find(x => x.id === gid);
  const o = g.objectives.find(x => x.id === oid);
  o.done = !o.done;
  save(); render();
}

function deleteObj(gid, oid) {
  const g = data.goals.find(x => x.id === gid);
  g.objectives = g.objectives.filter(x => x.id !== oid);
  save(); render();
}

// ── Filter / Sort ─────────────────────────────────────────────────────
document.getElementById('filterGroup').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filter = btn.dataset.filter;
  render();
});
document.getElementById('sortSelect').addEventListener('change', e => {
  sort = e.target.value;
  render();
});

// ── Modal keyboard close ──────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeGoalModal(); closeObjModal(); }
});
document.getElementById('goalModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeGoalModal(); });
document.getElementById('objModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeObjModal(); });

// Goal modal Enter key to save
document.getElementById('gTitle').addEventListener('keydown', e => { if (e.key === 'Enter') saveGoal(); });
document.getElementById('oText').addEventListener('keydown', e => { if (e.key === 'Enter') saveObj(); });

// ── Toast ─────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

// ── Drag & Drop — Goals ───────────────────────────────────────────────
let dragGoalId = null;
function dragGoalStart(e, id) {
  dragGoalId = id;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => { const c = document.getElementById('goal-'+id); if(c) c.style.opacity='0.45'; }, 0);
}
function dragGoalEnd() {
  dragGoalId = null;
  document.querySelectorAll('.goal-card').forEach(c => { c.style.opacity=''; c.classList.remove('drag-over'); });
}
function dragGoalOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function dragGoalLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function dragGoalDrop(e, targetId) {
  e.preventDefault();
  if (!dragGoalId || dragGoalId === targetId) return;
  const from = data.goals.findIndex(g => g.id === dragGoalId);
  const to   = data.goals.findIndex(g => g.id === targetId);
  if (from < 0 || to < 0) return;
  const [moved] = data.goals.splice(from, 1);
  data.goals.splice(to, 0, moved);
  save(); render();
}

// ── Drag & Drop — Objectives ─────────────────────────────────────────
let dragObjInfo = null;
function dragObjStart(e, gid, oid) {
  dragObjInfo = { gid, oid };
  e.dataTransfer.effectAllowed = 'move';
  e.stopPropagation();
  setTimeout(() => { const el = document.getElementById('obj-'+oid); if(el) el.style.opacity='0.45'; }, 0);
}
function dragObjEnd() {
  dragObjInfo = null;
  document.querySelectorAll('.obj-item').forEach(el => { el.style.opacity=''; el.classList.remove('drag-over'); });
}
function dragObjOver(e) { e.preventDefault(); e.stopPropagation(); e.currentTarget.classList.add('drag-over'); }
function dragObjLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function dragObjDrop(e, gid, targetOid) {
  e.preventDefault(); e.stopPropagation();
  if (!dragObjInfo || dragObjInfo.oid === targetOid || dragObjInfo.gid !== gid) return;
  const g = data.goals.find(x => x.id === gid);
  if (!g) return;
  const from = g.objectives.findIndex(o => o.id === dragObjInfo.oid);
  const to   = g.objectives.findIndex(o => o.id === targetOid);
  if (from < 0 || to < 0) return;
  const [moved] = g.objectives.splice(from, 1);
  g.objectives.splice(to, 0, moved);
  save(); render();
}

// ── Init ──────────────────────────────────────────────────────────────
load();
render();
window.renderAll = () => { load(); render(); };
</script>
