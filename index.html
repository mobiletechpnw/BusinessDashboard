<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#121213">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<script src="util.js"></script>
<script src="shared.js" defer></script>
<script src="supabase-sync.js" defer></script>
<title>Business Command Center</title>
<style>
/* Today: one figure, what needs you, and what's next. */
.brand { display: flex; align-items: center; gap: 10px; }
/* The sidebar carries the brand on wide screens. */
@media (min-width: 1024px) { header .brand-mark { display: none; } }
.brand-mark {
  width: 30px; height: 30px; border-radius: var(--r-sm); flex-shrink: 0;
  background: var(--surface2);
  display: flex; align-items: center; justify-content: center; font-size: 0.85rem;
}

main.today { max-width: 1200px; margin: 0 auto; padding: 28px 32px 48px; }
.today-head { margin-bottom: 24px; }
.today-date { font-size: 0.8125rem; font-weight: 500; color: var(--text2); }
.today-title { font-size: 2.125rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin-top: 2px; }
.today-grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 28px; align-items: start; }
.today-col { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.today-h2 { font-size: 1.0625rem; font-weight: 600; margin-bottom: 10px; }
.today .glist { background: var(--surface); border-radius: var(--r-lg); margin: 0; }
a.glist-row { color: var(--text); text-decoration: none; }
a.glist-row:hover { background: var(--fill-2); }
.glist-row > .vpc-ico { width: 16px; height: 16px; color: var(--label-3); margin-left: -6px; }
.glist-row .glist-val { margin-left: auto; }
.glist-val .is-red { color: var(--red); }

/* This month's sales, and the ring toward the monthly order goal */
.hero-card {
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  padding: 24px; border-radius: var(--r-lg); background: var(--surface);
  color: var(--text); text-decoration: none;
}
.hero-card:hover { background: color-mix(in srgb, var(--surface) 92%, white); }
.hero-label { font-size: 0.9375rem; color: var(--text2); }
.hero-value { font-size: 3rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; margin: 4px 0 8px; font-variant-numeric: tabular-nums; }
.hero-change { font-size: 0.875rem; color: var(--text2); }
.hero-change .up { color: var(--green); }
.hero-change .down { color: var(--red); }
.ring-wrap { display: flex; flex-direction: column; align-items: center; flex: none; }
.ring { position: relative; width: 112px; height: 112px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 12; }
.ring .track { stroke: var(--fill); }
.ring .fill { stroke: var(--green); stroke-linecap: round; transition: stroke-dashoffset 900ms var(--ease); }
.ring-pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.ring-caption { margin-top: 8px; font-size: 0.75rem; color: var(--text2); text-align: center; white-space: nowrap; }

/* Up next: the next show */
.upnext { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--r-lg); background: var(--surface); color: var(--text); text-decoration: none; }
.upnext:hover { background: color-mix(in srgb, var(--surface) 92%, white); }
.cal { width: 52px; flex: none; padding: 6px 0; border-radius: var(--r-md); background: var(--fill); text-align: center; }
.cal-mon { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text2); }
.cal-day { display: block; font-size: 1.375rem; font-weight: 700; line-height: 1.15; }
.upnext-main { flex: 1; min-width: 0; }
.upnext-title { font-size: 0.9375rem; font-weight: 600; }
.upnext-sub, .upnext-notes { font-size: 0.8125rem; color: var(--text2); }
.upnext-notes { margin-top: 4px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.upnext-count { font-size: 0.8125rem; color: var(--text2); white-space: nowrap; }
.upnext > .vpc-ico { width: 16px; height: 16px; color: var(--label-3); }
.show-mode-btn { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; min-height: 44px; border-radius: var(--r-full); background: var(--accent-fill); color: var(--on-accent); font-weight: 600; text-decoration: none; }
.show-mode-btn .vpc-ico { width: 18px; height: 18px; }

/* Swipe a Needs attention row left to snooze it until tomorrow */
.attn-row[data-key] { touch-action: pan-y; }
.attn-row[data-key]::after {
  content: 'Snooze'; position: absolute; top: 0; bottom: 0; left: 100%; width: 100%;
  display: flex; align-items: center; padding-left: 20px;
  background: var(--fill); color: var(--text2); font-size: 0.9375rem; font-weight: 600;
}
.attn-row.will-snooze::after { background: var(--accent-fill); color: var(--on-accent); }
.attn-more { display: block; width: 100%; padding: 10px 16px; border-radius: 0; background: none; color: var(--accent); font-size: 0.8125rem; font-weight: 500; text-align: left; }

/* A tip from Sensei, quiet */
.tip-card { padding: 18px 20px; border-radius: var(--r-lg); background: var(--surface); }
.tip-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.tip-cat { font-size: 0.75rem; font-weight: 600; padding: 2px 9px; border-radius: var(--r-full); background: var(--fill); color: var(--text2); }
.tip-count { font-size: 0.75rem; color: var(--text2); margin-left: auto; font-variant-numeric: tabular-nums; }
.tip-head { font-size: 0.9375rem; font-weight: 600; margin-bottom: 4px; }
.tip-body { font-size: 0.8125rem; color: var(--text2); line-height: 1.55; }
.tip-actions { display: flex; gap: 8px; margin-top: 14px; }
.sensei-btn { display: inline-flex; align-items: center; justify-content: center; background: var(--fill); color: var(--text); border: none; padding: 6px 14px; border-radius: var(--r-full); font-size: 0.8125rem; font-weight: 600; text-decoration: none; min-height: 32px; }
.sensei-btn:hover { background: var(--surface2); }
.sensei-btn.primary { background: var(--accent-fill); color: var(--on-accent); margin-left: auto; }
.sensei-btn.primary:hover { background: var(--accent-fill-hover); }
@media (pointer: coarse) { .sensei-btn { min-height: 44px; } }

@media (max-width: 900px) {
  .today-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 700px) {
  main.today { padding: 18px 16px 32px; }
  .today-title { font-size: 1.875rem; }
  .hero-card { padding: 20px; gap: 14px; }
  .hero-value { font-size: 2.5rem; }
  .ring { width: 92px; height: 92px; }
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">🌲</div>
    <div class="brand-name">VPC Command Center</div>
  </div>
</header>

<main class="today">
  <div class="today-head">
    <div class="today-date" id="tDate"></div>
    <h1 class="today-title large-title" id="tGreeting">Hello</h1>
  </div>

  <div class="today-grid">
    <div class="today-col">
      <a class="hero-card" href="vault-pine-collective.html#sales" aria-describedby="tRingCaption">
        <div>
          <div class="hero-label" id="tMonthLabel">This month so far</div>
          <div class="hero-value" id="tMonthValue">$0</div>
          <div class="hero-change" id="tChange"></div>
        </div>
        <div class="ring-wrap">
          <div class="ring" role="img" id="tRing" aria-label="Monthly goal">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <circle class="track" cx="60" cy="60" r="52"/>
              <circle class="fill" id="tRingFill" cx="60" cy="60" r="52" stroke-dasharray="326.73" stroke-dashoffset="326.73"/>
            </svg>
            <div class="ring-pct" id="tRingPct" aria-hidden="true">0%</div>
          </div>
          <div class="ring-caption" id="tRingCaption"></div>
        </div>
      </a>

      <section aria-labelledby="tAttnTitle">
        <h2 class="today-h2" id="tAttnTitle">Needs attention</h2>
        <div class="attn-list" id="tAttention"></div>
      </section>
    </div>

    <div class="today-col">
      <section aria-labelledby="tNextTitle">
        <h2 class="today-h2" id="tNextTitle">Up next</h2>
        <div id="tUpNext"></div>
      </section>

      <section aria-labelledby="tGlanceTitle">
        <h2 class="today-h2" id="tGlanceTitle">At a glance</h2>
        <div class="glist" id="tGlance"></div>
      </section>

      <section class="tip-card" aria-labelledby="sensei-home-head">
        <div class="tip-top">
          <span class="tip-cat" id="sensei-home-cat">Tip</span>
          <span class="tip-count" id="sensei-home-count"></span>
        </div>
        <div class="tip-head" id="sensei-home-head"></div>
        <div class="tip-body" id="sensei-home-body"></div>
        <div class="tip-actions">
          <button class="sensei-btn" type="button" onclick="senseiHomePrev()" aria-label="Previous tip">Previous</button>
          <button class="sensei-btn" type="button" onclick="senseiHomeNext()" aria-label="Next tip">Next</button>
          <a class="sensei-btn primary" href="guru.html">Academy</a>
        </div>
      </section>
    </div>
  </div>
</main>

<script>
'use strict';
// ══════════════════════════════════════════════════
//  TODAY — how am I doing, what needs me, what's next
// ══════════════════════════════════════════════════
const fmt = n => '$' + Math.round(Math.abs(n)).toLocaleString('en-US');
const esc = s => VPCUtil.esc(s == null ? '' : String(s));
const read = (key, fallback) => {
  try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; }
  catch (e) { return fallback; }
};
const CHEVRON = '<svg class="vpc-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
const pad = n => String(n).padStart(2, '0');
const ymdOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dateOf = s => new Date(String(s).slice(0, 10) + 'T00:00:00');
const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;
// Orders logged before the Printed column existed: finished ones count as printed.
const printStatusOf = o => (o.printStatus === 'printed' || o.printStatus === 'not_printed')
  ? o.printStatus : ((o.fulfillStatus || 'completed') === 'completed' ? 'printed' : 'not_printed');

function renderToday() {
  const now = new Date();
  const today = new Date(now); today.setHours(0, 0, 0, 0);
  const todayYmd = ymdOf(today);
  const thisMonth = todayYmd.slice(0, 7);
  const monthName = now.toLocaleDateString('en-US', { month: 'long' });

  // ── Greeting ──
  document.getElementById('tDate').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  const hr = now.getHours();
  document.getElementById('tGreeting').textContent = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';

  // ── This month so far, against the same days last month ──
  const month = VPCUtil.salesInPeriod(thisMonth);
  const lm = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const lmDays = new Date(lm.getFullYear(), lm.getMonth() + 1, 0).getDate();
  const lmTo = `${ymdOf(lm).slice(0, 8)}${pad(Math.min(now.getDate(), lmDays))}`;
  const prior = VPCUtil.salesBetween(ymdOf(lm), lmTo);
  const lmName = lm.toLocaleDateString('en-US', { month: 'short' });
  document.getElementById('tMonthLabel').textContent = `${monthName} so far`;
  countUp(document.getElementById('tMonthValue'), month.revenue);
  const change = document.getElementById('tChange');
  const span = `${lmName} 1–${Math.min(now.getDate(), lmDays)}`;
  if (prior.revenue > 0) {
    const pct = Math.round((month.revenue - prior.revenue) / prior.revenue * 100);
    change.innerHTML = pct === 0 ? `Level with ${span}`
      : `<span class="${pct > 0 ? 'up' : 'down'}">${pct > 0 ? '▲' : '▼'} ${Math.abs(pct)}%</span> vs ${span}`;
  } else {
    change.textContent = month.revenue > 0 ? `Nothing by this point in ${lm.toLocaleDateString('en-US', { month: 'long' })}` : 'No sales yet this month';
  }

  // Ring: order revenue toward the monthly goal set on the Sales Hub.
  const orders = VPCUtil.orderList();
  const goal = parseFloat(localStorage.getItem('riser_monthly_goal_v1')) || 1000;
  const orderRev = orders.filter(o => String(o.date).startsWith(thisMonth)).reduce((s, o) => s + (o.salePrice || 0), 0);
  const pct = Math.max(0, Math.min(100, Math.round(orderRev / goal * 100)));
  const C = 2 * Math.PI * 52;
  requestAnimationFrame(() => { document.getElementById('tRingFill').style.strokeDashoffset = String(C * (1 - pct / 100)); });
  document.getElementById('tRingPct').textContent = `${pct}%`;
  document.getElementById('tRingCaption').textContent = `${fmt(orderRev)} of ${fmt(goal)} goal`;
  document.getElementById('tRing').setAttribute('aria-label', `${pct}% of the ${fmt(goal)} monthly order goal`);

  // ── Needs attention: ranked, one job per row, each opens the right view ──
  const rows = [];
  const add = (tone, title, sub, href, end = '') => rows.push({ tone, title, sub, href, end });

  const toPrint = orders.filter(o => printStatusOf(o) === 'not_printed');
  if (toPrint.length) {
    const saved = read(VPCUtil.KEYS.orderProducts, []);
    let hours = 0, timed = 0;
    toPrint.forEach(o => {
      const p = saved.find(x => x.name === o.product);
      if (p && p.printHours) { hours += p.printHours * Math.max(1, parseInt(o.sets) || 1); timed++; }
    });
    add('orange', plural(toPrint.length, 'order') + ' to print',
      timed ? `About ${Math.round(hours * 10) / 10} hours of printing` : 'Open the print queue',
      'vault-pine-collective.html#print-queue');
  }
  const unpaid = orders.filter(o => o.payStatus === 'unpaid');
  const partial = orders.filter(o => o.payStatus === 'partial');
  if (unpaid.length || partial.length) {
    const owed = unpaid.reduce((s, o) => s + (o.salePrice || 0), 0);
    add('orange', `${plural(unpaid.length + partial.length, 'order')} waiting on payment`,
      [unpaid.length ? `${fmt(owed)} unpaid` : '', partial.length ? `${partial.length} partly paid` : ''].filter(Boolean).join(' · '),
      'vault-pine-collective.html#unpaid');
  }

  // Deliveries from the Sales Hub's Upcoming Deliveries list
  const week = new Date(today); week.setDate(week.getDate() + 7);
  // Your delivery list, plus open orders with a deliver-by date.
  const pipeline = [...read('vpc_pipeline_v1', []),
    ...orders.filter(o => o.deliverBy && (o.fulfillStatus || 'completed') !== 'completed')
      .map(o => ({ customer: o.customer, date: o.deliverBy }))];
  const late = pipeline.filter(p => p.date && dateOf(p.date) < today);
  const soon = pipeline.filter(p => p.date && dateOf(p.date) >= today && dateOf(p.date) <= week)
    .sort((a, b) => a.date.localeCompare(b.date));
  const names = list => list.slice(0, 2).map(p => p.customer).join(', ') + (list.length > 2 ? ` and ${list.length - 2} more` : '');
  if (late.length) add('red', `${plural(late.length, 'delivery', 'deliveries')} overdue`, names(late), 'vault-pine-collective.html#sales');
  if (soon.length === 1) {
    const d = dateOf(soon[0].date);
    add('orange', `${soon[0].customer} delivery`, `Due ${d.getTime() === today.getTime() ? 'today' : d.toLocaleDateString('en-US', { weekday: 'long' })}`, 'vault-pine-collective.html#sales');
  } else if (soon.length) {
    add('orange', `${soon.length} deliveries this week`, names(soon), 'vault-pine-collective.html#sales');
  }

  // Low stock: Jet Tags, Pins and your own categories
  const lowFrom = (salesKey, invKey, limit) => {
    const inv = read(invKey, null);
    if (!inv) return 0;
    const sold = {};
    read(salesKey, []).forEach(s => (s.chars || []).forEach(c => { sold[c] = (sold[c] || 0) + (s.charQty?.[c] ?? (s.qty || 1)); }));
    return inv.filter(c => { const left = c.purchased - (sold[c.id] || 0); return left >= 0 && left <= limit; }).length;
  };
  const jtLow = lowFrom(VPCUtil.KEYS.jetTags, VPCUtil.KEYS.jetTagInventory, 2);
  if (jtLow) add('orange', 'Jet Tags running low', `${plural(jtLow, 'character')} with 2 or fewer left`, 'vault-pine-collective.html#jettags');
  const pinLow = lowFrom(VPCUtil.KEYS.pins, VPCUtil.KEYS.pinInventory, 3);
  if (pinLow) add('orange', 'Pins running low', `${plural(pinLow, 'character')} with 3 or fewer left`, 'vault-pine-collective.html#pins');
  try {
    VPCUtil.customCatTotals().forEach(t => {
      if (t.low.length) add('orange', `${t.cat.name} running low`, `${plural(t.low.length, 'item')} with 3 or fewer left`, `vault-pine-collective.html#cat-${t.cat.id}`);
    });
  } catch (e) {}

  // Goals
  const goals = (read(VPCUtil.KEYS.goals, { goals: [] }).goals || []);
  const odGoals = goals.filter(x => !x.done && x.due && dateOf(x.due) < today);
  const soonGoals = goals.filter(x => !x.done && x.due && dateOf(x.due) >= today && dateOf(x.due) <= week);
  if (odGoals.length) add('red', `${plural(odGoals.length, 'goal')} overdue`, odGoals[0].title || odGoals[0].name || 'Update the date or close it', 'goals-dashboard.html');
  if (soonGoals.length) add('orange', `${plural(soonGoals.length, 'goal')} due this week`, soonGoals[0].title || soonGoals[0].name || '', 'goals-dashboard.html');

  // Personal spending: budget, and pace against last month
  const exps = read(VPCUtil.KEYS.expenses, []);
  const spent = exps.filter(e => String(e.date || '').startsWith(thisMonth)).reduce((s, e) => s + (e.amount || 0), 0);
  const budget = (read(VPCUtil.KEYS.expenseBudget, { total: 0 }).total) || 0;
  if (budget > 0 && spent > budget) add('red', 'Over budget this month', `${fmt(spent)} of ${fmt(budget)}`, 'expenses.html');
  else if (budget > 0 && spent > budget * 0.8) add('orange', `Budget ${Math.round(spent / budget * 100)}% used`, `${fmt(budget - spent)} left this month`, 'expenses.html');
  const lmSpent = exps.filter(e => String(e.date || '').startsWith(ymdOf(lm).slice(0, 7))).reduce((s, e) => s + (e.amount || 0), 0);
  const daysIn = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  if (lmSpent > 0 && spent > 0 && spent / now.getDate() * daysIn > lmSpent * 1.2) {
    add('orange', 'Spending is running high', `On pace for ${Math.round((spent / now.getDate() * daysIn / lmSpent - 1) * 100)}% more than last month`, 'expenses.html');
  }

  const order = { red: 0, orange: 1, blue: 2 };
  rows.sort((a, b) => order[a.tone] - order[b.tone]);
  // Snoozed rows stay hidden for the rest of the day.
  const snoozed = read(SNOOZE_KEY, {});
  const shown = rows.filter(r => snoozed[attnKey(r)] !== todayYmd);
  const hiddenCount = rows.length - shown.length;
  let html = shown.map(r =>
    `<a class="attn-row" data-tone="${r.tone}" data-key="${esc(attnKey(r))}" href="${r.href}"><span class="attn-dot"></span>` +
    `<span class="attn-text"><span class="attn-title">${esc(r.title)}</span>${r.sub ? `<span class="attn-sub">${esc(r.sub)}</span>` : ''}</span>${CHEVRON}</a>`
  ).join('');
  // Not backed up yet: one tap pushes everything to the cloud.
  if (!localStorage.getItem('vpc_sync_banner_dismissed') && localStorage.getItem(VPCUtil.KEYS.orders) && !localStorage.getItem('vpc_last_sync_at')) {
    html += `<button type="button" class="attn-row" data-tone="blue" onclick="backUpNow(this)"><span class="attn-dot"></span>` +
      `<span class="attn-text"><span class="attn-title">Back up to the cloud</span><span class="attn-sub">Your data lives in this browser until it's pushed</span></span>${CHEVRON}</button>`;
  }
  if (hiddenCount) html += `<button type="button" class="attn-more" onclick="unsnoozeAll()">Show ${plural(hiddenCount, 'snoozed item')}</button>`;
  document.getElementById('tAttention').innerHTML = html ||
    `<div class="attn-row"><span class="attn-dot"></span><span class="attn-text"><span class="attn-title">You're all caught up</span><span class="attn-sub">Nothing needs you right now</span></span></div>`;

  // ── Up next: the next show ──
  const events = read(VPCUtil.KEYS.events, []).map(VPCUtil.normalizeEvent)
    .filter(e => e.start && dateOf(e.end || e.start) >= today)
    .sort((a, b) => String(a.start).localeCompare(String(b.start)));
  const next = events[0];
  const upEl = document.getElementById('tUpNext');
  if (next) {
    const d = dateOf(next.start);
    const days = Math.round((d - today) / 864e5);
    const when = days <= 0 ? 'Today' : days === 1 ? 'Tomorrow' : `${days} days`;
    upEl.innerHTML = `<a class="upnext" href="events.html">
      <span class="cal" aria-hidden="true"><span class="cal-mon">${d.toLocaleDateString('en-US', { month: 'short' })}</span><span class="cal-day">${d.getDate()}</span></span>
      <span class="upnext-main">
        <span class="upnext-title">${esc(next.name || 'Show')}</span>
        <span class="upnext-sub" style="display:block">${d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}${next.location ? ' · ' + esc(next.location) : ''}${next.approved === false ? ' · awaiting approval' : ''}</span>
        ${next.notes ? `<span class="upnext-notes">${esc(next.notes)}</span>` : ''}
      </span>
      <span class="upnext-count">${when}</span>${CHEVRON}
    </a>` +
      (days <= 0 ? `<a class="show-mode-btn" href="show.html">${VPCUtil.icon('bolt')}Open Show Mode</a>` : '');
  } else {
    upEl.innerHTML = `<a class="upnext" href="events.html"><span class="upnext-main"><span class="upnext-title">No shows booked</span>` +
      `<span class="upnext-sub" style="display:block">Add your next event to see it here</span></span>${CHEVRON}</a>`;
  }

  // ── At a glance: one row per area, each a link ──
  const jt = read(VPCUtil.KEYS.jetTags, []), pins = read(VPCUtil.KEYS.pins, []);
  let catTotals = [];
  try { catTotals = VPCUtil.customCatTotals(); } catch (e) {}
  const allTime = VPCUtil.salesInPeriod('');
  const profit = orders.reduce((s, o) => s + (o.salePrice || 0) - (o.cogs || 0), 0)
    + jt.reduce((s, x) => s + (x.revenue || 0), 0) - jt.reduce((s, x) => s + (x.qty || 0), 0) * 0.747
    + pins.reduce((s, x) => s + (x.revenue || 0), 0) - pins.reduce((s, x) => s + (x.qty || 0), 0) * 0.95
    + catTotals.reduce((s, t) => s + (t.profit || 0), 0);
  const margin = allTime.revenue > 0 ? Math.round(profit / allTime.revenue * 100) : 0;
  const active = goals.filter(x => !x.done);
  const items = read(VPCUtil.KEYS.cardInventory, []);
  const invValue = items.reduce((s, i) => s + (i.lot ? +i.value || 0 : Math.max(1, Math.round(+i.qty) || 1) * (+i.value || 0)), 0);
  const snaps = (read(VPCUtil.KEYS.growth, { snapshots: [] }).snapshots || []).slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const lessons = Object.keys(read(VPCUtil.KEYS.guru, { completed: {} }).completed || {}).length;
  const glance = [
    ['vault-pine-collective.html#sales', 'All-time sales', fmt(allTime.revenue)],
    ['vault-pine-collective.html#sales', 'Gross profit', allTime.revenue > 0 ? `${fmt(profit)} · ${margin}%` : '—'],
    ['goals-dashboard.html', 'Goals', odGoals.length ? `<span class="is-red">${odGoals.length} overdue</span> · ${active.length} active` : `${active.length} active`],
    ['inventory.html', 'Card inventory', items.length ? fmt(invValue) : 'No items'],
    ['expenses.html', 'Personal spending', `${fmt(spent)} this month`],
    ['growth.html', 'Instagram', snaps.length ? `${(snaps[snaps.length - 1].followers || 0).toLocaleString('en-US')} followers` : '—'],
    ['guru.html', 'Academy', `${lessons} of 25 lessons`],
  ];
  document.getElementById('tGlance').innerHTML = glance.map(([href, label, val]) =>
    `<a class="glist-row" href="${href}"><span>${label}</span><span class="glist-val">${val}</span>${CHEVRON}</a>`).join('');
}

// ── Snooze: swipe a row left (or right-click it) to hide it until tomorrow ──
const SNOOZE_KEY = 'vpc_snoozed';
// A row's identity, stable as its numbers change ("2 orders to print" → "orders to print").
const attnKey = r => `${r.href}|${r.title.replace(/[\d$,.]+/g, '').trim().toLowerCase()}`;
function snoozeRow(key, row) {
  const day = ymdOf(new Date());
  const s = read(SNOOZE_KEY, {});
  Object.keys(s).forEach(k => { if (s[k] !== day) delete s[k]; });
  s[key] = day;
  localStorage.setItem(SNOOZE_KEY, JSON.stringify(s));
  row.style.transition = 'transform var(--t-move) var(--ease), opacity var(--t-move) var(--ease)';
  row.style.transform = 'translateX(-100%)';
  row.style.opacity = '0';
  setTimeout(renderToday, 260);
}
window.unsnoozeAll = () => { localStorage.removeItem(SNOOZE_KEY); renderToday(); };
(function attentionGestures() {
  const list = document.getElementById('tAttention');
  let s = null;
  list.addEventListener('pointerdown', e => {
    const row = e.target.closest('.attn-row[data-key]');
    if (row && e.pointerType === 'touch') s = { row, x0: e.clientX, y0: e.clientY, dx: 0, active: false };
  });
  list.addEventListener('pointermove', e => {
    if (!s) return;
    const dx = e.clientX - s.x0, dy = e.clientY - s.y0;
    if (!s.active) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { s = null; return; }
      if (Math.abs(dx) < 10) return;
      s.active = true;
    }
    s.dx = Math.min(0, dx);
    s.row.style.transform = `translateX(${s.dx}px)`;
    s.row.classList.toggle('will-snooze', s.dx < -90);
  });
  const end = () => {
    if (!s) return;
    const { row, dx, active } = s;
    s = null;
    if (!active) return;
    row._swiped = true;
    if (dx < -90) return snoozeRow(row.dataset.key, row);
    row.style.transition = 'transform var(--t-move) var(--ease-sheet)';
    row.style.transform = '';
    row.classList.remove('will-snooze');
    setTimeout(() => (row.style.transition = ''), 320);
  };
  list.addEventListener('pointerup', end);
  list.addEventListener('pointercancel', end);
  // A swipe isn't a tap.
  list.addEventListener('click', e => {
    const row = e.target.closest('.attn-row');
    if (row && row._swiped) { row._swiped = false; e.preventDefault(); e.stopPropagation(); }
  }, true);
  list.addEventListener('contextmenu', e => {
    const row = e.target.closest('.attn-row[data-key]');
    if (!row || !window.vpcMenu) return;
    e.preventDefault();
    vpcMenu(row, {
      label: 'Needs attention',
      options: [{ value: 'snooze', label: 'Snooze until tomorrow', icon: VPCUtil.icon('clock') }],
      at: { x: e.clientX, y: e.clientY },
      onSelect: () => snoozeRow(row.dataset.key, row),
    });
  });
})();

async function backUpNow(row) {
  row.querySelector('.attn-sub').textContent = 'Backing up…';
  await window.VpcSync?.pushAll();
  localStorage.setItem('vpc_sync_banner_dismissed', '1');
  row.remove();
}

// Numbers count up to their value; reduced motion shows them at once.
function countUp(el, target, duration = 700) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = fmt(target); return; }
  const start = performance.now();
  (function frame(t) {
    const k = Math.min(1, (t - start) / duration);
    el.textContent = fmt(target * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(frame);
  })(start);
}

// ── Sensei: a tip a day, with Previous / Next ──
(function initSenseiHome() {
  function tryInit() {
    if (!window.SENSEI_TIPS) { setTimeout(tryInit, 100); return; }
    const pool = [...window.SENSEI_TIPS.general, ...window.SENSEI_TIPS.sales, ...window.SENSEI_TIPS.goals, ...window.SENSEI_TIPS.expenses];
    // The same tip all day, a new one tomorrow.
    let idx = Math.floor(Date.now() / 864e5) % pool.length;
    function render() {
      const t = pool[idx];
      document.getElementById('sensei-home-cat').textContent = t.cat;
      document.getElementById('sensei-home-head').textContent = t.head;
      document.getElementById('sensei-home-body').textContent = t.body;
      document.getElementById('sensei-home-count').textContent = `${idx + 1} of ${pool.length}`;
    }
    window.senseiHomeNext = () => { idx = (idx + 1) % pool.length; render(); };
    window.senseiHomePrev = () => { idx = (idx - 1 + pool.length) % pool.length; render(); };
    render();
  }
  tryInit();
})();

renderToday();
// Called by VpcSync after it pulls newer data from the cloud.
window.renderAll = renderToday;
