<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1117">
<title>Reset Password — VPC</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#0f1117;font-family:system-ui,-apple-system,sans-serif;color:#e2e8f0;}

.card{background:#1a1d27;border:1px solid #2e3350;border-radius:18px;
  padding:44px 40px;width:400px;max-width:95vw;}

.logo{text-align:center;margin-bottom:32px;}
.logo-icon{font-size:2.4rem;margin-bottom:10px;}
.logo-title{font-size:1.25rem;font-weight:900;letter-spacing:-.4px;}
.logo-title .v{color:#6c8cff;}.logo-title .p{color:#34d399;}
.logo-sub{font-size:.8rem;color:#8892b0;margin-top:5px;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:.7rem;color:#8892b0;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px;}
.field input{width:100%;background:#0f1117;border:1px solid #2e3350;border-radius:9px;
  color:#e2e8f0;padding:11px 14px;font-size:.92rem;outline:none;font-family:inherit;
  transition:border-color .15s;}
.field input:focus{border-color:#6c8cff;}

.btn-submit{width:100%;background:#6c8cff;color:#fff;border:none;border-radius:9px;
  padding:13px;font-size:.92rem;font-weight:700;cursor:pointer;transition:all .15s;
  margin-top:6px;}
.btn-submit:hover{background:#7d9bff;}
.btn-submit:disabled{opacity:.55;cursor:not-allowed;}

.error{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);
  border-radius:8px;padding:10px 14px;font-size:.8rem;color:#f87171;
  margin-bottom:16px;display:none;line-height:1.5;}
.success{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);
  border-radius:8px;padding:10px 14px;font-size:.8rem;color:#34d399;
  margin-bottom:16px;display:none;line-height:1.5;}

.hint{text-align:center;font-size:.73rem;color:#8892b0;margin-top:20px;line-height:1.6;}
.hint a{color:#6c8cff;text-decoration:none;}
.hint a:hover{text-decoration:underline;}

.info{font-size:.82rem;color:#8892b0;line-height:1.65;margin-bottom:20px;padding:12px 14px;
  background:rgba(108,140,255,.07);border:1px solid rgba(108,140,255,.2);border-radius:8px;}
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon">🌲</div>
    <div class="logo-title"><span class="v">Vault</span> &amp; <span class="p">Pine</span></div>
    <div class="logo-sub" id="page-sub">Reset Password</div>
  </div>

  <div class="error"   id="error-box"></div>
  <div class="success" id="success-box"></div>

  <!-- Set new password (shown when recovery token present) -->
  <div id="set-form">
    <div class="field">
      <label>New Password</label>
      <input type="password" id="inp-new" placeholder="Min 6 characters" autocomplete="new-password">
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <input type="password" id="inp-confirm" placeholder="Repeat new password" autocomplete="new-password">
    </div>
    <button class="btn-submit" id="set-btn" onclick="handleSetPassword()">Set New Password</button>
  </div>

  <!-- Request reset email (shown when no token) -->
  <div id="request-form" style="display:none">
    <div class="info">Enter your account email and we'll send you a link to reset your password.</div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="inp-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <button class="btn-submit" id="req-btn" onclick="handleRequestReset()">Send Reset Email</button>
  </div>

  <div class="hint"><a href="login.html">← Back to Sign In</a></div>
</div>

<script>
const SUPABASE_URL = 'https://cqvnspbdfmgwcutezmqe.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxdm5zcGJkZm1nd2N1dGV6bXFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjI3MDUsImV4cCI6MjA5NjEzODcwNX0.0GGjc6i8VwgJgDUFNwcNzEy4r0_sAo57I5iMMPi7dII';

function show(id, msg) { const el = document.getElementById(id); el.textContent = msg; el.style.display = ''; }
function hide(id)       { document.getElementById(id).style.display = 'none'; }

// Parse hash params (Supabase implicit flow sends token in hash)
function getHashParams() {
  const hash = window.location.hash.slice(1);
  return hash ? Object.fromEntries(new URLSearchParams(hash)) : {};
}

const params    = getHashParams();
const token     = params.access_token;
const isRecovery = token && params.type === 'recovery';

if (!isRecovery) {
  document.getElementById('set-form').style.display     = 'none';
  document.getElementById('request-form').style.display = '';
  document.getElementById('page-sub').textContent       = 'Forgot Password';
}

async function handleSetPassword() {
  const newPass = document.getElementById('inp-new').value;
  const confirm = document.getElementById('inp-confirm').value;
  const btn     = document.getElementById('set-btn');

  if (!newPass || newPass.length < 6) { show('error-box', 'Password must be at least 6 characters.'); return; }
  if (newPass !== confirm)             { show('error-box', 'Passwords do not match.'); return; }
  hide('error-box');
  btn.disabled    = true;
  btn.textContent = 'Updating password…';

  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      method:  'PUT',
      headers: {
        'apikey':        SUPABASE_KEY,
        'Authorization': `Bearer ${token}`,
        'Content-Type':  'application/json',
      },
      body: JSON.stringify({ password: newPass }),
    });

    if (!res.ok) {
      const data = await res.json();
      show('error-box', data.error_description || data.msg || 'Failed to update password. The link may have expired.');
      return;
    }

    show('success-box', '✅ Password updated! Redirecting to sign in…');
    setTimeout(() => { window.location.href = 'login.html'; }, 2200);

  } catch {
    show('error-box', 'Connection error — check your internet and try again.');
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Set New Password';
  }
}

async function handleRequestReset() {
  const email = document.getElementById('inp-email').value.trim();
  const btn   = document.getElementById('req-btn');

  if (!email) { show('error-box', 'Email is required.'); return; }
  hide('error-box');
  btn.disabled    = true;
  btn.textContent = 'Sending…';

  try {
    const redirectTo = new URL('reset-password.html', window.location.href).href;
    await fetch(`${SUPABASE_URL}/auth/v1/recover`, {
      method:  'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body:    JSON.stringify({ email, redirectTo }),
    });
    show('success-box', '✅ If that email has an account, a reset link is on its way. Check your inbox.');
  } catch {
    show('error-box', 'Connection error — check your internet and try again.');
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Send Reset Email';
  }
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  isRecovery ? handleSetPassword() : handleRequestReset();
});
</script>
</body>
</html>
