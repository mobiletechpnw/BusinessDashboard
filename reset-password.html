<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1c1c1e">
<title>Reset Password — VPC</title>
<style>
/* Tokens: dark below; light follows the device, or the Appearance setting
   (util.js sets data-theme before the page paints). Same values as styles.css. */
:root {
  color-scheme: dark;
  --bg: #000000; --surface: #1c1c1e; --surface2: #2c2c2e; --fill: rgba(118, 118, 128, 0.24);
  --border: rgba(255, 255, 255, 0.1); --text: #f5f5f7; --text2: #a1a1a6;
  --accent: #2997ff; --accent-fill: #0071e3; --accent-hover: #0077ed; --ring: #2997ff; --on-accent: #ffffff;
  --accent2: #bf5af2; --green: #30d158; --yellow: #ffd60a; --red: #ff6961;
  --shadow: 0 24px 80px rgba(0, 0, 0, 0.45); --overlay: rgba(0, 0, 0, 0.6);
  --radius: 12px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme='dark']) {
    color-scheme: light;
    --bg: #f5f5f7; --surface: #ffffff; --surface2: #f2f2f7; --fill: rgba(118, 118, 128, 0.12);
    --border: rgba(60, 60, 67, 0.14); --text: #1d1d1f; --text2: #636366;
    --accent: #0060c4; --accent-fill: #0071e3; --accent-hover: #0077ed; --ring: #0071e3;
    --accent2: #8944ab; --green: #187634; --yellow: #8a6200; --red: #c4001a;
    --shadow: 0 24px 60px rgba(0, 0, 0, 0.08); --overlay: rgba(0, 0, 0, 0.35);
  }
}
:root[data-theme='light'] {
  color-scheme: light;
  --bg: #f5f5f7; --surface: #ffffff; --surface2: #f2f2f7; --fill: rgba(118, 118, 128, 0.12);
  --border: rgba(60, 60, 67, 0.14); --text: #1d1d1f; --text2: #636366;
  --accent: #0060c4; --accent-fill: #0071e3; --accent-hover: #0077ed; --ring: #0071e3;
  --accent2: #8944ab; --green: #187634; --yellow: #8a6200; --red: #c4001a;
  --shadow: 0 24px 60px rgba(0, 0, 0, 0.08); --overlay: rgba(0, 0, 0, 0.35);
}
/* Line icons from icons.svg */
.vpc-ico { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
.vpc-ico.inline { margin-right: 0.3em; }

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;}

.card{background:var(--surface);
  border:1px solid color-mix(in srgb, var(--text) 10%, transparent);border-radius:20px;
  padding:44px 40px;width:400px;max-width:95vw;
  box-shadow:var(--shadow);}

.logo{text-align:center;margin-bottom:32px;}
.logo-icon{font-size:2.4rem;margin-bottom:10px;}
.logo-title{font-size:1.25rem;font-weight:700;letter-spacing:-.4px;}
.logo-title .v{color:var(--accent);}.logo-title .p{color:var(--green);}
.logo-sub{font-size:.8rem;color:var(--text2);margin-top:5px;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:0.75rem;color:var(--text2);font-weight:600;
  margin-bottom:7px;}
.field input{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:12px;
  color:var(--text);padding:11px 14px;font-size:.92rem;outline:none;font-family:inherit;
  transition:border-color .15s;}
.field input:focus{border-color:var(--accent);}

.btn-submit{width:100%;background:var(--accent-fill);color:var(--on-accent);border:none;border-radius:999px;
  padding:13px;font-size:.92rem;font-weight:600;cursor:pointer;transition:all .15s;
  margin-top:6px;}
.btn-submit:hover{background:var(--accent-hover);}
.btn-submit:disabled{opacity:.55;cursor:not-allowed;}

.error{background:color-mix(in srgb, var(--red) 10%, transparent);border:1px solid color-mix(in srgb, var(--red) 30%, transparent);
  border-radius:8px;padding:10px 14px;font-size:.8rem;color:var(--red);
  margin-bottom:16px;display:none;line-height:1.5;}
.success{background:color-mix(in srgb, var(--green) 10%, transparent);border:1px solid color-mix(in srgb, var(--green) 30%, transparent);
  border-radius:8px;padding:10px 14px;font-size:.8rem;color:var(--green);
  margin-bottom:16px;display:none;line-height:1.5;}

.hint{text-align:center;font-size:0.75rem;color:var(--text2);margin-top:20px;line-height:1.6;}
.hint a{color:var(--accent);text-decoration:none;}
.hint a:hover{text-decoration:underline;}

.info{font-size:.82rem;color:var(--text2);line-height:1.65;margin-bottom:20px;padding:12px 14px;
  background:color-mix(in srgb, var(--accent) 7%, transparent);border:1px solid color-mix(in srgb, var(--accent) 20%, transparent);border-radius:8px;}

.loading{text-align:center;padding:20px 0;color:var(--text2);font-size:.85rem;display:none;}
.spinner{display:inline-block;width:22px;height:22px;border:3px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;
  vertical-align:middle;margin-right:10px;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script src="util.js"></script>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon">🌲</div>
    <div class="logo-title"><span class="v">Vault</span> &amp; <span class="p">Pine</span></div>
    <div class="logo-sub" id="page-sub">Reset Password</div>
  </div>

  <div class="error"   id="error-box"></div>
  <div class="success" id="success-box"></div>

  <!-- Verifying link spinner -->
  <div class="loading" id="loading-state">
    <span class="spinner"></span>Verifying reset link…
  </div>

  <!-- Set new password (shown when we have a valid recovery token) -->
  <div id="set-form" style="display:none">
    <div class="field">
      <label>New Password</label>
      <input type="password" id="inp-new" placeholder="Min 6 characters" autocomplete="new-password">
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <input type="password" id="inp-confirm" placeholder="Repeat new password" autocomplete="new-password">
    </div>
    <button class="btn-submit" id="set-btn" onclick="handleSetPassword()">Set New Password</button>
  </div>

  <!-- Request reset email (shown when no valid token in URL) -->
  <div id="request-form" style="display:none">
    <div class="info" id="request-info">Enter your account email and we'll send you a link to reset your password.</div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="inp-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <button class="btn-submit" id="req-btn" onclick="handleRequestReset()">Send Reset Email</button>
  </div>

  <div class="hint"><a href="login.html">← Back to Sign In</a></div>
</div>

<script>
const SUPABASE_URL = 'https://cqvnspbdfmgwcutezmqe.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxdm5zcGJkZm1nd2N1dGV6bXFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjI3MDUsImV4cCI6MjA5NjEzODcwNX0.0GGjc6i8VwgJgDUFNwcNzEy4r0_sAo57I5iMMPi7dII';

function show(id, msg) { const el = document.getElementById(id); el.textContent = msg; el.style.display = 'block'; }
function hide(id)       { document.getElementById(id).style.display = 'none'; }

// Collect params from BOTH the hash fragment and query string.
// Supabase implicit flow puts tokens in the hash (#access_token=...&type=recovery).
// Supabase OTP/email-link flow puts token_hash in the query string (?token_hash=...&type=recovery).
function getAllUrlParams() {
  const hashStr   = window.location.hash.slice(1);
  const hashObj   = hashStr ? Object.fromEntries(new URLSearchParams(hashStr)) : {};
  const queryObj  = Object.fromEntries(new URLSearchParams(window.location.search));
  return { ...queryObj, ...hashObj }; // hash values win on conflict
}

let recoveryToken = null; // set after we have a valid access_token

function showSetForm() {
  hide('loading-state');
  document.getElementById('set-form').style.display = 'block';
}

function showRequestForm(info) {
  hide('loading-state');
  if (info) document.getElementById('request-info').textContent = info;
  document.getElementById('request-form').style.display = 'block';
  document.getElementById('page-sub').textContent = 'Forgot Password';
}

async function initPage() {
  const p = getAllUrlParams();

  // Supabase returned an error in the URL
  if (p.error) {
    show('error-box', p.error_description || p.error);
    showRequestForm('The reset link was invalid or expired. Enter your email to get a new one.');
    return;
  }

  // Implicit flow — Supabase redirected with #access_token=...&type=recovery
  if (p.access_token && p.type === 'recovery') {
    recoveryToken = p.access_token;
    showSetForm();
    return;
  }

  // OTP / email-link flow — Supabase delivers ?token_hash=...&type=recovery
  if (p.token_hash && p.type === 'recovery') {
    document.getElementById('loading-state').style.display = 'block';
    try {
      const res  = await fetch(`${SUPABASE_URL}/auth/v1/verify`, {
        method:  'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
        body:    JSON.stringify({ token_hash: p.token_hash, type: 'recovery' }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error_description || data.message || 'Verification failed');
      recoveryToken = data.access_token;
      showSetForm();
    } catch (e) {
      show('error-box', e.message.includes('expired') || e.message.includes('invalid')
        ? 'This reset link has expired. Please request a new one.'
        : 'Could not verify reset link — it may have expired.');
      showRequestForm('Enter your email to get a fresh reset link.');
    }
    return;
  }

  // No recognizable token — show the request form
  showRequestForm();
}

async function handleSetPassword() {
  const newPass = document.getElementById('inp-new').value;
  const confirm = document.getElementById('inp-confirm').value;
  const btn     = document.getElementById('set-btn');

  if (!newPass || newPass.length < 6) { show('error-box', 'Password must be at least 6 characters.'); return; }
  if (newPass !== confirm)             { show('error-box', 'Passwords do not match.'); return; }
  hide('error-box');
  btn.disabled    = true;
  btn.textContent = 'Updating password…';

  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      method:  'PUT',
      headers: {
        'apikey':        SUPABASE_KEY,
        'Authorization': `Bearer ${recoveryToken}`,
        'Content-Type':  'application/json',
      },
      body: JSON.stringify({ password: newPass }),
    });

    if (!res.ok) {
      const data = await res.json();
      show('error-box', data.error_description || data.msg || 'Failed to update password. The link may have expired.');
      return;
    }

    show('success-box', 'Password updated. Redirecting to sign in…');
    setTimeout(() => { window.location.href = 'login.html'; }, 2200);

  } catch {
    show('error-box', 'Connection error — check your internet and try again.');
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Set New Password';
  }
}

async function handleRequestReset() {
  const email = document.getElementById('inp-email').value.trim();
  const btn   = document.getElementById('req-btn');

  if (!email) { show('error-box', 'Email is required.'); return; }
  hide('error-box');
  btn.disabled    = true;
  btn.textContent = 'Sending…';

  try {
    const redirectTo = new URL('reset-password.html', window.location.href).href;
    await fetch(`${SUPABASE_URL}/auth/v1/recover`, {
      method:  'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body:    JSON.stringify({ email, redirectTo }),
    });
    show('success-box', 'If that email has an account, a reset link is on its way. Check your inbox.');
  } catch {
    show('error-box', 'Connection error — check your internet and try again.');
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Send Reset Email';
  }
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (document.getElementById('set-form').style.display !== 'none') {
    handleSetPassword();
  } else {
    handleRequestReset();
  }
});

initPage();
</script>
</body>
</html>
