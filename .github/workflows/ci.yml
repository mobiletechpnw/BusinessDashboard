name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.56.1 cannot
    # install Chromium on. Bump together with the playwright devDependency.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Unit + inline-syntax tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E page-load suite (desktop + mobile, fresh + seeded)
        run: npm run test:e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-screenshots
          path: tests/screenshots/
          retention-days: 14
